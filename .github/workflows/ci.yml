name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HEXVAULT validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type-check web and API
        run: |
          npx tsc --noEmit --incremental false -p apps/web/tsconfig.json
          npx tsc --noEmit --incremental false -p apps/api/tsconfig.json

      - name: Run ESLint
        run: npm run lint

      - name: Run available test scripts
        run: |
          npm run test --if-present
          npm run test --workspaces --if-present

      - name: Build web and API services
        run: npm run build
