name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: HEXVAULT validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      NOTES_ENCRYPTION_KEY: ci-only-placeholder-notes-key-with-at-least-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Verify Prisma migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Check for unmigrated Prisma schema changes
        # The previous step applied all migrations to this disposable CI database.
        # Compare that database to the datamodel without replaying migrations in a shadow database.
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Type-check web and API
        run: |
          npx tsc --noEmit --incremental false -p apps/web/tsconfig.json
          npx tsc --noEmit --incremental false -p apps/api/tsconfig.json

      - name: Run ESLint
        run: npm run lint

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/api/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/**', 'packages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js applications
        run: npm run build

  deploy-render:
    name: Deploy API to Render
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render API deploy
        env:
          API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$API_DEPLOY_HOOK" || { echo "RENDER_API_DEPLOY_HOOK_URL is not configured"; exit 1; }

          build_hook_url() {
            local url="$1"
            local sha="$2"
            if [[ "$url" == *"?"* ]]; then
              echo "${url}&ref=${sha}"
            else
              echo "${url}?ref=${sha}"
            fi
          }

          api_url=$(build_hook_url "$API_DEPLOY_HOOK" "$COMMIT_SHA")

          echo "Triggering hexvault-api deploy hook..."
          curl --fail-with-body --retry 3 --retry-all-errors --request POST "$api_url"
          echo "Render API deployment triggered successfully."
