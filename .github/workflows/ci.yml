name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: HEXVAULT validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
      NOTES_ENCRYPTION_KEY: ci-only-placeholder-notes-key-with-at-least-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Verify Prisma migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Verify migration status and schema sync
        run: npx prisma migrate status --exit-code

      - name: Type-check web and API
        run: |
          npx tsc --noEmit --incremental false -p apps/web/tsconfig.json
          npx tsc --noEmit --incremental false -p apps/api/tsconfig.json

      - name: Run ESLint
        run: npm run lint

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/api/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/**', 'packages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js applications
        run: npm run build

      - name: Run available test scripts
        run: |
          npm run test --if-present
          npm run test --workspaces --if-present

  docker-build:
    name: Docker build (${{ matrix.app }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            APP_NAME=${{ matrix.app }}
            API_INTERNAL_HOSTPORT=hexvault-api:10000
          cache-from: type=gha,scope=hexvault-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=hexvault-${{ matrix.app }}

  deploy-render:
    name: Deploy verified commit to Render
    needs: [validate, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Trigger API and web deploys
        env:
          API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$API_DEPLOY_HOOK" || { echo "RENDER_API_DEPLOY_HOOK_URL is not configured"; exit 1; }
          test -n "$WEB_DEPLOY_HOOK" || { echo "RENDER_WEB_DEPLOY_HOOK_URL is not configured"; exit 1; }

          build_hook_url() {
            local url="$1"
            local sha="$2"
            if [[ "$url" == *"?"* ]]; then
              echo "${url}&ref=${sha}"
            else
              echo "${url}?ref=${sha}"
            fi
          }

          api_url=$(build_hook_url "$API_DEPLOY_HOOK" "$COMMIT_SHA")
          web_url=$(build_hook_url "$WEB_DEPLOY_HOOK" "$COMMIT_SHA")

          echo "Triggering hexvault-api deploy hook..."
          curl --fail-with-body --retry 3 --retry-all-errors --request POST "$api_url"
          echo ""

          echo "Triggering hexvault-web deploy hook..."
          curl --fail-with-body --retry 3 --retry-all-errors --request POST "$web_url"
          echo ""
