services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hexvault}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    image: hexvault-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env to use host postgres}
      DIRECT_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env to use host postgres}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: hexvault-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env to use host postgres}
      DIRECT_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env to use host postgres}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NOTES_ENCRYPTION_KEY: ${NOTES_ENCRYPTION_KEY:?Set NOTES_ENCRYPTION_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Kolkata}
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-hexvault-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-HEXVAULT <no-reply@example.com>}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: hexvault-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: web
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env to use host postgres}
      DIRECT_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env to use host postgres}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api:4000
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Kolkata}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-hexvault-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-hexvault-local-only-change-me}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "${S3_BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_store_data:/data

  storage-init:
    image: hexvault-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api
        API_INTERNAL_URL: http://api:4000
    restart: "no"
    command: ["node", "/workspace/scripts/provision-object-store.mjs"]
    depends_on:
      - rustfs
    environment:
      S3_ENDPOINT: http://rustfs:9000
      APP_URL: ${APP_URL:-http://localhost:3000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-hexvault-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
      - "${CLAMAV_BIND_ADDRESS:-127.0.0.1}:${CLAMAV_PORT:-3310}:3310"

volumes:
  postgres_data:
  object_store_data:
