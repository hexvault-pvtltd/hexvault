# Render Blueprint for the HEXVAULT production stack.
# CI triggers exact-commit deploys through the two service deploy hooks.
previews:
  generation: off

databases:
  - name: hexvault-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: hexvault
    user: hexvault
    ipAllowList: []

services:
  - type: web
    name: hexvault-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerBuildArgs:
      - key: APP_NAME
        value: api
    preDeployCommand: /workspace/migrations/node_modules/.bin/prisma migrate deploy --schema /workspace/prisma/schema.prisma
    dockerCommand: node server.js
    healthCheckPath: /api/health/ready
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: api
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: APP_URL
        sync: false # Set in Render to your frontend URL (e.g. https://your-domain.vercel.app)
      - key: AUTH_SECRET
        generateValue: true
      - key: NOTES_ENCRYPTION_KEY
        generateValue: true
      - key: COMPANY_TIMEZONE
        value: Asia/Kolkata
      # Supply credentials for an existing private S3-compatible bucket.
      # Set these on a standalone Vercel web project as well: its local API
      # route handlers take precedence over the API_INTERNAL_URL fallback.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false # HTTPS endpoint for S3-compatible storage; empty for AWS S3.
      - key: S3_PUBLIC_ENDPOINT
        sync: false # Browser-reachable endpoint; empty to use S3_ENDPOINT.
