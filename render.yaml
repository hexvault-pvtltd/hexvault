# Render Blueprint for the HEXVAULT production stack.
# CI triggers exact-commit deploys through the two service deploy hooks.
previews:
  generation: off

databases:
  - name: hexvault-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: hexvault
    user: hexvault
    ipAllowList: []

services:
  - type: web
    name: hexvault-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerBuildArgs:
      - key: APP_NAME
        value: api
    preDeployCommand: /workspace/migrations/node_modules/.bin/prisma migrate deploy --schema /workspace/prisma/schema.prisma
    dockerCommand: node server.js
    healthCheckPath: /api/health/ready
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: api
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: APP_URL
        sync: false # Set in Render to your frontend URL (e.g. https://your-domain.vercel.app)
      - key: AUTH_SECRET
        generateValue: true
      - key: NOTES_ENCRYPTION_KEY
        generateValue: true
      - key: COMPANY_TIMEZONE
        value: Asia/Kolkata
