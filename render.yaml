# Render Blueprint for the HEXVAULT production stack.
# CI triggers exact-commit deploys through the two service deploy hooks.
previews:
  generation: off

databases:
  - name: hexvault-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: hexvault
    user: hexvault
    ipAllowList: []

services:
  - type: web
    name: hexvault-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c '/workspace/migrations/node_modules/.bin/prisma migrate deploy --schema /workspace/prisma/schema.prisma && node server.js'
    healthCheckPath: /api/health/ready
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: api
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: APP_URL
        fromService:
          type: web
          name: hexvault-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_SECRET
        generateValue: true
      - key: NOTES_ENCRYPTION_KEY
        generateValue: true
      - key: COMPANY_TIMEZONE
        value: Asia/Kolkata

  - type: web
    name: hexvault-web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: web
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: hexvault-db
          property: connectionString
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: web
          name: hexvault-api
          property: hostport
      - key: APP_URL
        fromService:
          type: web
          name: hexvault-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COMPANY_TIMEZONE
        value: Asia/Kolkata
